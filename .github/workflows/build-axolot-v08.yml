name: Build Axolot Client v0.8.1 Nebula Fix

on:
  push:
    branches:
      - axolot-v08-nebula-build-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact Nebula source
        shell: pwsh
        run: |
          $names = @(
            "00","01","02","03","04",
            "05a","05b","05c","05d",
            "06a","06b","06c","06d",
            "07a","07b","07c","07d",
            "08"
          )
          $parts = $names | ForEach-Object { Get-Content -Raw ("axolot-v08-build/payload.part" + $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v08-build/payload.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "axolot-v08-build/source-root" | Out-Null
          Expand-Archive -Path "axolot-v08-build/payload.zip" -DestinationPath "axolot-v08-build/source-root" -Force
          $src = Get-ChildItem "axolot-v08-build/source-root" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v08-build/source"

          # Force a side-by-side install so Windows cannot launch the old Quick Launch build.
          $pkgPath = "axolot-v08-build/source/package.json"
          $pkg = Get-Content -Raw $pkgPath | ConvertFrom-Json
          $pkg.version = "0.8.1"
          $pkg | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $pkgPath

          $cfgPath = "axolot-v08-build/source/src-tauri/tauri.conf.json"
          $cfg = Get-Content -Raw $cfgPath | ConvertFrom-Json
          $cfg.productName = "Axolot Client Nebula"
          $cfg.version = "0.8.1"
          $cfg.identifier = "com.axolot.client.nebula081"
          $cfg.app.windows[0].title = "Axolot Client - Nebula 0.8.1"
          $cfg | ConvertTo-Json -Depth 30 | Set-Content -Encoding UTF8 $cfgPath

          $mainPath = "axolot-v08-build/source/src/main.tsx"
          $main = Get-Content -Raw $mainPath
          $main = $main.Replace("AXOLOT NEBULA // SYSTEM READY", "AXOLOT NEBULA 08.1 // SYSTEM READY")
          $main = $main.Replace("<span className=\"axo-brand-copy\"><strong>AXOLOT</strong><small>CLIENT</small></span>", "<span className=\"axo-brand-copy\"><strong>AXOLOT</strong><small>CLIENT · NEBULA 08.1</small></span>")
          Set-Content -Encoding UTF8 $mainPath $main

          # Fail the build if the reconstructed UI is the old Fast-style Quick Launch layout.
          $verify = Get-Content -Raw $mainPath
          if ($verify -notmatch "hero-reef" -or $verify -notmatch "AXOLOT NEBULA 08.1") {
            throw "Nebula UI verification failed"
          }
          if ($verify -match "<h1>Quick Launch</h1>") {
            throw "Old Quick Launch UI detected"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: axolot-v08-build/source
        run: npm install

      - name: Build NSIS installer
        working-directory: axolot-v08-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.8.1-Nebula-Fix
          path: axolot-v08-build/source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
