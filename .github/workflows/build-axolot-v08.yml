name: Build Axolot Client v0.8 Nebula

on:
  push:
    branches:
      - axolot-v08-nebula-build-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Axolot v0.8 source
        shell: pwsh
        run: |
          $names = @(
            "00","01","02","03","04",
            "05a","05b","05c","05d",
            "06a","06b","06c","06d",
            "07a","07b","07c","07d",
            "08"
          )
          $parts = $names | ForEach-Object { Get-Content -Raw ("axolot-v08-build/payload.part" + $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v08-build/payload.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "axolot-v08-build/source-root" | Out-Null
          Expand-Archive -Path "axolot-v08-build/payload.zip" -DestinationPath "axolot-v08-build/source-root" -Force
          $src = Get-ChildItem "axolot-v08-build/source-root" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v08-build/source"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: axolot-v08-build/source
        run: npm install

      - name: Build NSIS installer
        working-directory: axolot-v08-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.8-Nebula-Windows-Installer
          path: axolot-v08-build/source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
