name: Build Axolot Client 0.12.4

on:
  push:
    branches: [main]
    paths:
      - 'axolot-release/Axolot-Client-v0.12.4-Source.zip'
      - '.github/workflows/axolot-release-v0124.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force axolot-build | Out-Null
          Expand-Archive -Path "axolot-release/Axolot-Client-v0.12.4-Source.zip" -DestinationPath axolot-build -Force
          $root = Get-ChildItem axolot-build -Directory | Select-Object -First 1
          if (-not $root) { throw "Source root not found" }
          "AXOLOT_ROOT=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:AXOLOT_ROOT
          npm install

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location $env:AXOLOT_ROOT
          npm run build

      - name: Verify Rust backend
        shell: pwsh
        run: |
          Set-Location "$env:AXOLOT_ROOT/src-tauri"
          cargo check

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:AXOLOT_ROOT
          npm run tauri build -- --bundles nsis

      - name: Prepare release files
        id: prep
        shell: pwsh
        run: |
          $version = "0.12.4"
          $source = Get-ChildItem "$env:AXOLOT_ROOT/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS installer not found" }
          $installer = "Axolot-Client-Setup-$version.exe"
          Copy-Item $source.FullName $installer
          Copy-Item "axolot-release/Axolot-Client-v0.12.4-Source.zip" "Axolot-Client-v0.12.4-Source.zip"
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          @{
            version = $version
            download_url = "https://github.com/${{ github.repository }}/releases/download/axolot-v$version/$installer"
            sha256 = $sha
            notes = "Axolot 0.12.4 desktop launcher shell, internal scrolling, compact launch UI and hands-free updater."
            mandatory = $false
          } | ConvertTo-Json | Set-Content -Encoding UTF8 axolot-update.json
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "axolot-v0.12.4"
          $installer = "${{ steps.prep.outputs.installer }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer "Axolot-Client-v0.12.4-Source.zip" "axolot-update.json" --clobber
            gh release edit $tag --title "Axolot Client 0.12.4 RC" --notes "Fixed desktop-style launcher UI and hands-free updater." --latest
          } else {
            gh release create $tag $installer "Axolot-Client-v0.12.4-Source.zip" "axolot-update.json" --title "Axolot Client 0.12.4 RC" --notes "Fixed desktop-style launcher UI and hands-free updater." --latest --target "${{ github.sha }}"
          }
