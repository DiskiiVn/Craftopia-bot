name: Axolot Client 0.16.1 Native Launcher Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axolot-v0161-native-preview.yml'
      - 'axolot-build/v0.16.1/BUILD-PREVIEW.txt'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct 0.16.1 launcher source
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.16.0-preview/Axolot-Client-v0.16.0-Source.zip" -OutFile "$env:RUNNER_TEMP\base.zip"
          Expand-Archive "$env:RUNNER_TEMP\base.zip" -DestinationPath "work" -Force
          if (-not (Test-Path "work\Axolot-Client-v0.16.0\package.json")) { throw "Missing Axolot 0.16.0 source root" }
          Rename-Item "work\Axolot-Client-v0.16.0" "Axolot-Client-v0.16.1"
          $patch64 = (Get-Content -Raw "axolot-build/v0.16.1/LauncherRebuild.patch.gz.b64").Trim()
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\launcher-patch.gz", [Convert]::FromBase64String($patch64))
          python -c "import gzip,sys;open(sys.argv[2],'wb').write(gzip.decompress(open(sys.argv[1],'rb').read()))" "$env:RUNNER_TEMP\launcher-patch.gz" "$env:RUNNER_TEMP\launcher.patch"
          Push-Location "work\Axolot-Client-v0.16.1"
          git apply --check "$env:RUNNER_TEMP\launcher.patch"
          git apply "$env:RUNNER_TEMP\launcher.patch"
          Pop-Location
          $pkg = Get-Content -Raw "work\Axolot-Client-v0.16.1\package.json" | ConvertFrom-Json
          if ($pkg.version -ne "0.16.1") { throw "Package version mismatch" }
          if (-not (Test-Path "work\Axolot-Client-v0.16.1\src\native161.css")) { throw "Native CSS missing" }

      - name: Verify bundled Axolot Core
        shell: pwsh
        run: |
          $jar="work\Axolot-Client-v0.16.1\src-tauri\resources\axolot-client-core.jar"
          if (-not (Test-Path $jar)) { throw "Bundled Core missing" }
          if ((Get-Item $jar).Length -lt 100000) { throw "Bundled Core corrupted" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: work/Axolot-Client-v0.16.1
        run: npm install --no-audit --no-fund

      - name: Check TypeScript and build frontend
        working-directory: work/Axolot-Client-v0.16.1
        run: npm run build

      - name: Check Rust backend
        working-directory: work/Axolot-Client-v0.16.1/src-tauri
        run: cargo check

      - name: Build Windows NSIS installer
        working-directory: work/Axolot-Client-v0.16.1
        run: npm run tauri build -- --bundles nsis

      - name: Prepare preview release
        id: release
        shell: pwsh
        run: |
          $work="work\Axolot-Client-v0.16.1"
          $exe=Get-ChildItem "$work\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installer missing" }
          $installer="Axolot-Client-Setup-0.16.1.exe"
          Copy-Item $exe.FullName $installer -Force
          $sha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $stage="$env:RUNNER_TEMP\Axolot-Client-v0.16.1"
          Copy-Item $work $stage -Recurse -Force
          @("$stage\node_modules","$stage\dist","$stage\src-tauri\target","$stage\axolot-core\.gradle","$stage\axolot-core\build") | ForEach-Object { if (Test-Path $_) { Remove-Item $_ -Force -Recurse } }
          Compress-Archive -Path $stage -DestinationPath "Axolot-Client-v0.16.1-Source.zip" -Force
          @{
            version="0.16.1"
            channel="preview"
            sha256=$sha
            notes="Minecraft Java Edition native launcher redesign: scenic game stage, version selector, large green PLAY dock, desktop Installations manager, retained game backend and maximize/resize."
          } | ConvertTo-Json | Set-Content -Encoding UTF8 axolot-preview.json
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Publish preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axolot-v0.16.1-preview
          target_commitish: main
          name: Axolot Client 0.16.1 Launcher Preview
          prerelease: true
          make_latest: false
          body: |
            Preview only. Stable Supabase auto-update is unchanged.
            Native Minecraft Java style launch page and functional installations list, original Minecraft landscape wallpaper, Windows maximize and resizing.
            This is a QA build, not a general public release.
          files: |
            ${{ steps.release.outputs.installer }}
            Axolot-Client-v0.16.1-Source.zip
            axolot-preview.json
