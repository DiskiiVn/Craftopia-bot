name: Release Axolot Client 0.15.0 Nova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'axolot-build/v0.15.0/BUILD-READY-NOVA.txt'
      - '.github/workflows/release-axolot-v0150.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Nova source
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.12.4/Axolot-Client-v0.12.4-Source.zip" -OutFile "$env:RUNNER_TEMP\base.zip"
          Expand-Archive "$env:RUNNER_TEMP\base.zip" -DestinationPath "work" -Force
          Rename-Item "work\Axolot-Client-v0.12.4" "Axolot-Client-v0.15.0"

          $parts = Get-ChildItem "axolot-build/v0.15.0/nova-chunks/nova-part*.b64" | Sort-Object Name
          if ($parts.Count -ne 16) { throw "Expected 16 Nova patch chunks, found $($parts.Count)" }
          $patch64 = ($parts | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ""
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\Axolot-v0.15.0-Nova.patch", [Convert]::FromBase64String($patch64))

          git apply --check --unsafe-paths --directory="work/Axolot-Client-v0.15.0" "$env:RUNNER_TEMP\Axolot-v0.15.0-Nova.patch"
          git apply --unsafe-paths --directory="work/Axolot-Client-v0.15.0" "$env:RUNNER_TEMP\Axolot-v0.15.0-Nova.patch"

          $pkg = Get-Content -Raw "work\Axolot-Client-v0.15.0\package.json" | ConvertFrom-Json
          if ($pkg.version -ne "0.15.0") { throw "Nova patch version is $($pkg.version), expected 0.15.0" }

      - name: Prepare Axolot Core from Fast Client source
        shell: pwsh
        run: |
          git clone https://github.com/justdreno/Fast-Client.git "work/Axolot-Client-v0.15.0/axolot-core"
          git -C "work/Axolot-Client-v0.15.0/axolot-core" checkout dea60753ab79cdbced608246ccf324e2b0334a4c
          python "work/Axolot-Client-v0.15.0/scripts/prepare_axolot_core.py" "work/Axolot-Client-v0.15.0/axolot-core"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Axolot Core
        shell: pwsh
        working-directory: work/Axolot-Client-v0.15.0/axolot-core
        run: |
          .\gradlew.bat build
          $jar = Get-ChildItem "build\libs\axolot-core-0.15.0*.jar" | Where-Object { $_.Name -notmatch 'sources' } | Select-Object -First 1
          if (-not $jar) { throw "Axolot Core 0.15.0 release jar not found" }
          Copy-Item $jar.FullName "..\src-tauri\resources\axolot-client-core.jar" -Force
          Copy-Item $jar.FullName "$env:GITHUB_WORKSPACE\Axolot-Core-0.15.0.jar" -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install launcher dependencies
        working-directory: work/Axolot-Client-v0.15.0
        run: npm install --no-audit --no-fund

      - name: Verify Nova frontend
        working-directory: work/Axolot-Client-v0.15.0
        run: npm run build

      - name: Verify Rust backend
        working-directory: work/Axolot-Client-v0.15.0/src-tauri
        run: cargo check

      - name: Build Windows NSIS installer
        working-directory: work/Axolot-Client-v0.15.0
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release assets
        id: release
        shell: pwsh
        run: |
          $work = "work\Axolot-Client-v0.15.0"
          $version = (Get-Content -Raw "$work\package.json" | ConvertFrom-Json).version
          if ($version -ne "0.15.0") { throw "Unexpected version $version" }

          $built = Get-ChildItem "$work\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $built) { throw "NSIS installer not found" }

          $installer = "Axolot-Client-Setup-$version.exe"
          Copy-Item $built.FullName $installer
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $download = "https://rlbgvgosxrhqnppbrtey.supabase.co/storage/v1/object/public/axolot-releases/stable/$installer"

          @{
            version = $version
            download_url = $download
            sha256 = $sha
            notes = "Axolot 0.15.0 Nova: dense desktop UI, SmartBoost, Pre-Launch Doctor, profile snapshots, Server Deck, resource/shader manager and Ctrl+K command palette."
            mandatory = $false
          } | ConvertTo-Json | Set-Content -Encoding UTF8 axolot-update.json

          $stage = "$env:RUNNER_TEMP\Axolot-Client-v$version"
          Copy-Item $work $stage -Recurse
          @(
            "$stage\node_modules",
            "$stage\dist",
            "$stage\src-tauri\target",
            "$stage\axolot-core\.git",
            "$stage\axolot-core\.gradle",
            "$stage\axolot-core\build"
          ) | ForEach-Object { if (Test-Path $_) { Remove-Item $_ -Recurse -Force } }
          Compress-Archive -Path $stage -DestinationPath "Axolot-Client-v$version-Source.zip" -Force

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=axolot-v$version" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Publish Nova release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: Axolot Client ${{ steps.release.outputs.version }} Nova RC
          body: |
            Axolot Client 0.15.0 Nova.
            Rebuilt desktop experience with SmartBoost, Pre-Launch Doctor, Profile Snapshots, Server Deck, pack/shader management, Activity Center and Axolot Core.
            Fast Client-derived Core attribution is retained. Verify upstream redistribution rights before public/commercial distribution.
          make_latest: true
          files: |
            ${{ steps.release.outputs.installer }}
            Axolot-Core-0.15.0.jar
            axolot-update.json
            Axolot-Client-v${{ steps.release.outputs.version }}-Source.zip
