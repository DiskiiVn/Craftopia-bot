name: Build and Release Axolot Client v0.12

on:
  push:
    branches:
      - axolot-v012-release-build-20261007
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = 0..8 | ForEach-Object { Get-Content -Raw ("axolot-v012-build/payload.part{0:D2}" -f $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v012-build/source.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "axolot-v012-build/source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "80dd350f1eca5e2670590852d21aa94e2172c18dda4ab81ab028c2582cc3d7cf") { throw "Source ZIP SHA mismatch: $sha" }
          New-Item -ItemType Directory -Force -Path "axolot-v012-build/unpacked" | Out-Null
          Expand-Archive -Path "axolot-v012-build/source.zip" -DestinationPath "axolot-v012-build/unpacked" -Force
          $src = Get-ChildItem "axolot-v012-build/unpacked" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v012-build/source"

      - name: Verify v0.12 source
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw "axolot-v012-build/source/package.json"
          $cfg = Get-Content -Raw "axolot-v012-build/source/src-tauri/tauri.conf.json"
          $main = Get-Content -Raw "axolot-v012-build/source/src/main.tsx"
          $rust = Get-Content -Raw "axolot-v012-build/source/src-tauri/src/lib.rs"
          if ($pkg -notmatch '"version"\s*:\s*"0.12.0"') { throw "Wrong package version" }
          if ($cfg -notmatch 'Release Candidate 0.12.0') { throw "Wrong Tauri title" }
          if ($main -notmatch 'microsoft-login-progress') { throw "Microsoft live progress UI missing" }
          if ($rust -notmatch 'Minecraft Services rejected this Axolot Client ID') { throw "Microsoft diagnostics missing" }
          if ($rust -notmatch 'install_launcher_update') { throw "Updater command missing" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: axolot-v012-build/source
        run: npm install

      - name: Build frontend
        working-directory: axolot-v012-build/source
        run: npm run build

      - name: Cargo check
        working-directory: axolot-v012-build/source/src-tauri
        run: cargo check

      - name: Build NSIS installer
        working-directory: axolot-v012-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "axolot-v012-build/source/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "axolot-v012-build/Axolot-Client-Setup-0.12.0-RC.exe"
          $exeSha = (Get-FileHash "axolot-v012-build/Axolot-Client-Setup-0.12.0-RC.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = "0.12.0"
            download_url = "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.12.0/Axolot-Client-Setup-0.12.0-RC.exe"
            sha256 = $exeSha
            notes = "Axolot Client 0.12: cinematic motion system, live Microsoft OAuth/Xbox/XSTS/Minecraft progress, improved diagnostics, real Modrinth + CurseForge catalogs, AutoBoost, live console, crash center and verified in-app updater."
            mandatory = $false
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "axolot-v012-build/axolot-update.json" -Value $manifest -Encoding UTF8
          Write-Host "Installer SHA256: $exeSha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.12.0-Release-Candidate
          path: |
            axolot-v012-build/Axolot-Client-Setup-0.12.0-RC.exe
            axolot-v012-build/axolot-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete axolot-v0.12.0 --repo "${{ github.repository }}" --yes 2>$null
          git push origin :refs/tags/axolot-v0.12.0 2>$null
          gh release create axolot-v0.12.0 "axolot-v012-build/Axolot-Client-Setup-0.12.0-RC.exe" "axolot-v012-build/axolot-update.json" "axolot-v012-build/source.zip#Axolot-Client-v0.12.0-Source.zip" --repo "${{ github.repository }}" --title "Axolot Client v0.12.0 RC" --notes "Cinematic release candidate with Microsoft sign-in progress/diagnostics, automatic verified updater, cloud-managed Microsoft/CurseForge configuration, real mod catalogs, AutoBoost, live console and crash center."
