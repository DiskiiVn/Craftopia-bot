name: Build and Release Axolot Client v0.12.1

on:
  push:
    branches:
      - axolot-v0121-update-20261007
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.12 source
        shell: pwsh
        run: |
          $parts = 0..8 | ForEach-Object { Get-Content -Raw ("axolot-v012-build/payload.part{0:D2}" -f $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v0121-build/base-source.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "axolot-v0121-build/base-source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "80dd350f1eca5e2670590852d21aa94e2172c18dda4ab81ab028c2582cc3d7cf") { throw "Base source ZIP SHA mismatch: $sha" }
          New-Item -ItemType Directory -Force -Path "axolot-v0121-build/unpacked" | Out-Null
          Expand-Archive -Path "axolot-v0121-build/base-source.zip" -DestinationPath "axolot-v0121-build/unpacked" -Force
          $src = Get-ChildItem "axolot-v0121-build/unpacked" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v0121-build/source"

      - name: Apply v0.12.1 patch
        run: python axolot-v0121-build/patch_v0121.py axolot-v0121-build/source

      - name: Verify v0.12.1 source
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw "axolot-v0121-build/source/package.json"
          $cfg = Get-Content -Raw "axolot-v0121-build/source/src-tauri/tauri.conf.json"
          $main = Get-Content -Raw "axolot-v0121-build/source/src/main.tsx"
          $rust = Get-Content -Raw "axolot-v0121-build/source/src-tauri/src/lib.rs"
          if ($pkg -notmatch '"version"\s*:\s*"0.12.1"') { throw "Wrong package version" }
          if ($cfg -notmatch 'Release Candidate 0.12.1') { throw "Wrong Tauri title" }
          if ($main -notmatch 'Apply for Minecraft access') { throw "Approval UI missing" }
          if ($main -notmatch 'Continue Offline') { throw "Offline fallback missing" }
          if ($rust -notmatch 'MC_APP_NOT_ALLOWLISTED') { throw "Minecraft allowlist diagnostic missing" }
          if ($rust -notmatch 'install_launcher_update') { throw "Updater command missing" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: axolot-v0121-build/source
        run: npm install

      - name: Build frontend
        working-directory: axolot-v0121-build/source
        run: npm run build

      - name: Cargo check
        working-directory: axolot-v0121-build/source/src-tauri
        run: cargo check

      - name: Build NSIS installer
        working-directory: axolot-v0121-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "axolot-v0121-build/source/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "axolot-v0121-build/Axolot-Client-Setup-0.12.1-RC.exe"
          $exeSha = (Get-FileHash "axolot-v0121-build/Axolot-Client-Setup-0.12.1-RC.exe" -Algorithm SHA256).Hash.ToLower()
          Compress-Archive -Path "axolot-v0121-build/source/*" -DestinationPath "axolot-v0121-build/Axolot-Client-v0.12.1-Source.zip" -Force
          $manifest = @{
            version = "0.12.1"
            download_url = "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.12.1/Axolot-Client-Setup-0.12.1-RC.exe"
            sha256 = $exeSha
            notes = "Axolot Client 0.12.1: Minecraft AppID approval UX, official approval shortcut, safe Offline fallback while Premium access awaits allowlisting, plus the v0.12 cinematic motion system and verified automatic updater."
            mandatory = $false
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "axolot-v0121-build/axolot-update.json" -Value $manifest -Encoding UTF8
          Write-Host "Installer SHA256: $exeSha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.12.1-Release-Candidate
          path: |
            axolot-v0121-build/Axolot-Client-Setup-0.12.1-RC.exe
            axolot-v0121-build/Axolot-Client-v0.12.1-Source.zip
            axolot-v0121-build/axolot-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete axolot-v0.12.1 --repo "${{ github.repository }}" --yes 2>$null
          git push origin :refs/tags/axolot-v0.12.1 2>$null
          gh release create axolot-v0.12.1 "axolot-v0121-build/Axolot-Client-Setup-0.12.1-RC.exe" "axolot-v0121-build/axolot-update.json" "axolot-v0121-build/Axolot-Client-v0.12.1-Source.zip" --repo "${{ github.repository }}" --title "Axolot Client v0.12.1 RC" --notes "Hot update delivered through the built-in updater. Adds official Minecraft AppID approval guidance and an Offline fallback. Premium login will work after Mojang/Minecraft allowlists the Axolot Client ID; this server-side allowlist cannot be bypassed by the launcher."
