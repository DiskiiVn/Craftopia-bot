name: Build Axolot Client v0.11.2 Microsoft Fix

on:
  push:
    branches:
      - axolot-v0112-fix-build-20261007
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Axolot v0.11 source
        shell: pwsh
        run: |
          $parts = 0..7 | ForEach-Object { Get-Content -Raw ("axolot-v011-base/payload.part{0:D2}" -f $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v011-base/payload.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "axolot-v011-base/source-root" | Out-Null
          Expand-Archive -Path "axolot-v011-base/payload.zip" -DestinationPath "axolot-v011-base/source-root" -Force
          $entries = Get-ChildItem "axolot-v011-base/source-root"
          $dirs = @($entries | Where-Object { $_.PSIsContainer })
          if ($dirs.Count -eq 1 -and (Test-Path (Join-Path $dirs[0].FullName "package.json"))) {
            Move-Item $dirs[0].FullName "axolot-v011-base/source"
          } else {
            New-Item -ItemType Directory -Force -Path "axolot-v011-base/source" | Out-Null
            Get-ChildItem "axolot-v011-base/source-root" | Move-Item -Destination "axolot-v011-base/source"
          }

      - name: Apply cloud-admin layer
        shell: pwsh
        run: |
          $patch = @(
            Get-Content -Raw "axolot-v011-base/apply_cloud.part00"
            Get-Content -Raw "axolot-v011-base/apply_cloud.part01"
            Get-Content -Raw "axolot-v011-base/apply_cloud.part02"
          ) -join ""
          Set-Content -Path "axolot-v011-base/apply_cloud_admin.py" -Value $patch -Encoding UTF8
          python "axolot-v011-base/apply_cloud_admin.py"

      - name: Apply Microsoft diagnostics fix
        run: python axolot-v011-base/apply_v0112.py

      - name: Verify v0.11.2 source
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw "axolot-v011-base/source/package.json"
          $cfg = Get-Content -Raw "axolot-v011-base/source/src-tauri/tauri.conf.json"
          $main = Get-Content -Raw "axolot-v011-base/source/src/main.tsx"
          $rust = Get-Content -Raw "axolot-v011-base/source/src-tauri/src/lib.rs"
          if ($pkg -notmatch '"version"\s*:\s*"0.11.2"') { throw "Wrong package version" }
          if ($cfg -notmatch 'Release Candidate 0.11.2') { throw "Wrong app title" }
          if ($main -notmatch 'LOGIN DIAGNOSTIC') { throw "Microsoft diagnostic UI missing" }
          if ($rust -notmatch 'Invalid app registration') { throw "Minecraft allowlist diagnostic missing" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: axolot-v011-base/source
        run: npm install

      - name: Build NSIS installer
        working-directory: axolot-v011-base/source
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $exe = Get-ChildItem "axolot-v011-base/source/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "Axolot-Client-Setup-0.11.2-RC.exe"
          $sha = (Get-FileHash "Axolot-Client-Setup-0.11.2-RC.exe" -Algorithm SHA256).Hash.ToLower()
          $json = @{
            version = "0.11.2"
            download_url = "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.11.2/Axolot-Client-Setup-0.11.2-RC.exe"
            sha256 = $sha
            notes = "Microsoft sign-in diagnostics, exact OAuth/Xbox/Minecraft errors, and Minecraft Services 403 Invalid app registration detection."
          } | ConvertTo-Json -Depth 4
          Set-Content "axolot-update.json" $json -Encoding UTF8
          Write-Host "SHA256=$sha"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "axolot-v0.11.2" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "axolot-v0.11.2" --repo "${{ github.repository }}" --yes --cleanup-tag
          }
          gh release create "axolot-v0.11.2" "Axolot-Client-Setup-0.11.2-RC.exe" "axolot-update.json" --repo "${{ github.repository }}" --title "Axolot Client v0.11.2 RC" --notes "Microsoft authentication diagnostic fix. Browser authorization no longer leaves the launcher stuck on Waiting; Axolot now shows the exact OAuth, Xbox/XSTS, or Minecraft Services failure."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.11.2-Microsoft-Fix
          path: |
            Axolot-Client-Setup-0.11.2-RC.exe
            axolot-update.json
          if-no-files-found: error
          retention-days: 7
