name: Build Axolot Client v0.10.1 RC

on:
  push:
    branches:
      - axolot-v0101-realmods-build-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified base source
        shell: pwsh
        run: |
          $parts = 0..7 | ForEach-Object { Get-Content -Raw ("axolot-v092-build/payload.part{0:D2}" -f $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v092-build/payload.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "axolot-v092-build/payload.zip" -Algorithm SHA256).Hash.ToLower()
          $expected = "aea27a6959ca07381ff06c6456bd6c6887405e565ccd2a5c6fda8b7bdf5171c9"
          if ($actual -ne $expected) { throw "Payload checksum mismatch" }
          New-Item -ItemType Directory -Force -Path "axolot-v092-build/source-root" | Out-Null
          Expand-Archive -Path "axolot-v092-build/payload.zip" -DestinationPath "axolot-v092-build/source-root" -Force
          $src = Get-ChildItem "axolot-v092-build/source-root" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v092-build/source"

      - name: Apply v0.10 premium base
        shell: pwsh
        run: |
          $pkgPath = "axolot-v092-build/source/package.json"
          $pkg = Get-Content -Raw $pkgPath | ConvertFrom-Json
          $pkg.version = "0.10.0"
          $pkg | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $pkgPath

          $cfgPath = "axolot-v092-build/source/src-tauri/tauri.conf.json"
          $cfg = Get-Content -Raw $cfgPath | ConvertFrom-Json
          $cfg.version = "0.10.0"
          $cfg.app.windows[0].title = "Axolot Client - Release Candidate 0.10"
          $cfg | ConvertTo-Json -Depth 30 | Set-Content -Encoding UTF8 $cfgPath

          $mainPath = "axolot-v092-build/source/src/main.tsx"
          $main = Get-Content -Raw $mainPath
          $main = $main.Replace("CLIENT · RELEASE RC", "CLIENT · NEBULA 0.10")
          $main = $main.Replace("AXOLOT NEBULA RC // GAME ENGINE ONLINE", "AXOLOT NEBULA 0.10 // PERFORMANCE LAYER")
          $main = $main.Replace("Build it. Tune it.<br/><em>Then dive in.</em>", "Own your game.<br/><em>Move without friction.</em>")
          $main = $main.Replace("A cinematic Minecraft command center for profiles, mods, AutoBoost and everything Axolot — tuned to feel fast before the game even starts.", "Profiles, accounts, mods and performance live in one focused command layer — fast to read, fast to switch, built for Minecraft.")
          $main = $main.Replace("AXOLOT NEBULA 0.9.2", "AXOLOT NEBULA 0.10")
          Set-Content -Encoding UTF8 $mainPath $main

          Get-Content -Raw "axolot-v093-build/profile-fix.css" | Add-Content -Encoding UTF8 "axolot-v092-build/source/src/styles.css"
          Get-Content -Raw "axolot-v010-build/v010-premium.css" | Add-Content -Encoding UTF8 "axolot-v092-build/source/src/styles.css"

      - name: Apply v0.10.1 fixes
        shell: pwsh
        run: python axolot-v0101-build/patch_v0101.py

      - name: Verify v0.10.1 source
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw "axolot-v092-build/source/package.json"
          $cfg = Get-Content -Raw "axolot-v092-build/source/src-tauri/tauri.conf.json"
          $main = Get-Content -Raw "axolot-v092-build/source/src/main.tsx"
          $styles = Get-Content -Raw "axolot-v092-build/source/src/styles.css"
          $lib = Get-Content -Raw "axolot-v092-build/source/src-tauri/src/lib.rs"
          if ($pkg -notmatch '"version"\s*:\s*"0.10.1"') { throw "Wrong package version" }
          if ($cfg -notmatch 'Release Candidate 0.10.1') { throw "Wrong Tauri title" }
          if ($main -notmatch 'Loading real Modrinth catalog') { throw "Real Modrinth catalog patch missing" }
          if ($main -match 'setCatalogProjects\(fallbackMods\)') { throw "Fallback demo mod cards still active" }
          if ($styles -notmatch 'active-account-pill') { throw "Account chip CSS missing" }
          if ($lib -notmatch 'AxolotClient/0.10.1') { throw "Backend version missing" }
          if ($lib -notmatch 'query.trim\(\).is_empty\(\).*downloads') { throw "Top-mod auto load backend patch missing" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: axolot-v092-build/source
        run: npm install

      - name: TypeScript and Vite build
        working-directory: axolot-v092-build/source
        run: npm run build

      - name: Rust check
        working-directory: axolot-v092-build/source/src-tauri
        run: cargo check

      - name: Build NSIS installer
        working-directory: axolot-v092-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.10.1-Real-Mods-Account-Fix
          path: axolot-v092-build/source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
