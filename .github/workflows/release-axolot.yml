name: Release Axolot Client 0.12.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'axolot-build/v0.12.4/READY'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Axolot 0.12.3 source base
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.12.3/Axolot-Client-v0.12.3-Source.zip" -OutFile "$env:RUNNER_TEMP\axolot-base.zip"
          Expand-Archive "$env:RUNNER_TEMP\axolot-base.zip" -DestinationPath "axolot-src" -Force
          if (-not (Test-Path "axolot-src\axolot-v0123-work\package.json")) { throw "Axolot base source layout is invalid" }

      - name: Apply Axolot 0.12.4 patch
        shell: pwsh
        working-directory: axolot-src/axolot-v0123-work
        run: |
          git apply --unsafe-paths -p4 "$env:GITHUB_WORKSPACE\axolot-build\v0.12.4\Axolot-v0.12.4.patch"
          $main = "src\main.tsx"
          $text = Get-Content -Raw $main
          $text = $text.Replace(
            "https://github.com/DiskiiVn/Craftopia-bot/releases/latest/download/axolot-update.json",
            "https://rlbgvgosxrhqnppbrtey.supabase.co/storage/v1/object/public/axolot-releases/stable/axolot-update.json"
          )
          Set-Content -Encoding UTF8 $main $text

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: axolot-src/axolot-v0123-work
        run: npm install

      - name: Verify frontend
        working-directory: axolot-src/axolot-v0123-work
        run: npm run build

      - name: Verify Rust backend
        working-directory: axolot-src/axolot-v0123-work/src-tauri
        run: cargo check

      - name: Build Windows installer
        working-directory: axolot-src/axolot-v0123-work
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release assets
        id: release
        shell: pwsh
        run: |
          $work = "axolot-src\axolot-v0123-work"
          $version = (Get-Content -Raw "$work\package.json" | ConvertFrom-Json).version
          if ($version -ne "0.12.4") { throw "Unexpected version $version" }
          $tag = "axolot-v$version"
          $source = Get-ChildItem "$work\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS installer not found" }
          $installer = "Axolot-Client-Setup-$version.exe"
          Copy-Item $source.FullName $installer
          Compress-Archive -Path "$work\*" -DestinationPath "Axolot-Client-v$version-Source.zip" -Force
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $download = "https://rlbgvgosxrhqnppbrtey.supabase.co/storage/v1/object/public/axolot-releases/stable/$installer"
          @{
            version = $version
            download_url = $download
            sha256 = $sha
            notes = "Axolot 0.12.4 desktop shell, fixed Play layout and hands-free verified updates."
            mandatory = $false
          } | ConvertTo-Json | Set-Content -Encoding UTF8 axolot-update.json
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Publish staging release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: Axolot Client ${{ steps.release.outputs.version }} RC
          body: |
            Axolot Client 0.12.4 desktop launcher update.
            This GitHub release is the build staging source for the Supabase stable channel.
          make_latest: true
          files: |
            ${{ steps.release.outputs.installer }}
            axolot-update.json
            Axolot-Client-v${{ steps.release.outputs.version }}-Source.zip
