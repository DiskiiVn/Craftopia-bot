name: Build Axolot Client v0.10 RC

on:
  push:
    branches:
      - axolot-v010-real-build-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = 0..8 | ForEach-Object { Get-Content -Raw ("axolot-v010-build/payload.part{0:D2}" -f $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v010-build/payload.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "axolot-v010-build/source-root" | Out-Null
          Expand-Archive -Path "axolot-v010-build/payload.zip" -DestinationPath "axolot-v010-build/source-root" -Force
          $src = Get-ChildItem "axolot-v010-build/source-root" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v010-build/source"

      - name: Verify v0.10 source
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw "axolot-v010-build/source/package.json"
          $cfg = Get-Content -Raw "axolot-v010-build/source/src-tauri/tauri.conf.json"
          $main = Get-Content -Raw "axolot-v010-build/source/src/main.tsx"
          if ($pkg -notmatch '"version"\s*:\s*"0.10.0"') { throw "Wrong package version" }
          if ($cfg -notmatch 'Release Candidate 0.10') { throw "Wrong Tauri title" }
          if ($main -notmatch 'Identity Vault') { throw "v0.10 Accounts UI not found" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: axolot-v010-build/source
        run: npm install

      - name: Build NSIS installer
        working-directory: axolot-v010-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.10.0-RC-Windows-Installer
          path: axolot-v010-build/source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
