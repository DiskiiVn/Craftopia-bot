name: Build and Release Axolot Client v0.12.3

on:
  push:
    branches:
      - axolot-v0123-auto-update-ui-20261007
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v0.12.2 source
        shell: pwsh
        run: |
          $parts = 0..9 | ForEach-Object { Get-Content -Raw ("axolot-v0122-build/payload.part{0:D2}" -f $_) }
          $b64 = $parts -join ""
          [IO.File]::WriteAllBytes("axolot-v0123-build/base-source.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "axolot-v0123-build/base-source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "d31d4a38805684e65b477ae2c05cf944894347525767f7f2eb1e569255484861") { throw "Base source ZIP SHA mismatch: $sha" }
          New-Item -ItemType Directory -Force -Path "axolot-v0123-build/unpacked" | Out-Null
          Expand-Archive -Path "axolot-v0123-build/base-source.zip" -DestinationPath "axolot-v0123-build/unpacked" -Force
          $src = Get-ChildItem "axolot-v0123-build/unpacked" -Directory | Select-Object -First 1
          Move-Item $src.FullName "axolot-v0123-build/source"

      - name: Apply automatic update UI patch
        shell: pwsh
        run: python "axolot-v0123-build/patch.py" "axolot-v0123-build/source"

      - name: Verify v0.12.3 source
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw "axolot-v0123-build/source/package.json"
          $cfg = Get-Content -Raw "axolot-v0123-build/source/src-tauri/tauri.conf.json"
          $main = Get-Content -Raw "axolot-v0123-build/source/src/main.tsx"
          $css = Get-Content -Raw "axolot-v0123-build/source/src/styles.css"
          if ($pkg -notmatch '"version"\s*:\s*"0.12.3"') { throw "Wrong package version" }
          if ($cfg -notmatch 'Release Candidate 0.12.3') { throw "Wrong Tauri title" }
          if ($main -notmatch 'updatePromptOpen') { throw "Automatic update prompt missing" }
          if ($main -notmatch 'every 10 minutes while open') { throw "Periodic update check UI missing" }
          if ($main -notmatch 'update-available-chip') { throw "Persistent update chip missing" }
          if ($css -notmatch 'v0.12.3 automatic update surface') { throw "Update motion CSS missing" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: axolot-v0123-build/source
        run: npm install

      - name: Build frontend
        working-directory: axolot-v0123-build/source
        run: npm run build

      - name: Cargo check
        working-directory: axolot-v0123-build/source/src-tauri
        run: cargo check

      - name: Build NSIS installer
        working-directory: axolot-v0123-build/source
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "axolot-v0123-build/source/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "axolot-v0123-build/Axolot-Client-Setup-0.12.3-RC.exe"
          $exeSha = (Get-FileHash "axolot-v0123-build/Axolot-Client-Setup-0.12.3-RC.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = "0.12.3"
            download_url = "https://github.com/DiskiiVn/Craftopia-bot/releases/download/axolot-v0.12.3/Axolot-Client-Setup-0.12.3-RC.exe"
            sha256 = $exeSha
            notes = "Automatic update experience: Axolot checks at startup, when the launcher regains focus and every 10 minutes. New releases appear automatically in a cinematic update screen with changelog, Update now/Later controls and a persistent topbar update badge. No manual Scan is required."
            mandatory = $false
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "axolot-v0123-build/axolot-update.json" -Value $manifest -Encoding UTF8
          Remove-Item -Recurse -Force "axolot-v0123-build/source/node_modules" -ErrorAction SilentlyContinue\n          Remove-Item -Recurse -Force "axolot-v0123-build/source/dist" -ErrorAction SilentlyContinue\n          Remove-Item -Recurse -Force "axolot-v0123-build/source/src-tauri/target" -ErrorAction SilentlyContinue\n          Compress-Archive -Path "axolot-v0123-build/source/*" -DestinationPath "axolot-v0123-build/Axolot-Client-v0.12.3-Source.zip" -Force
          Write-Host "Installer SHA256: $exeSha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axolot-Client-v0.12.3-Release-Candidate
          path: |
            axolot-v0123-build/Axolot-Client-Setup-0.12.3-RC.exe
            axolot-v0123-build/Axolot-Client-v0.12.3-Source.zip
            axolot-v0123-build/axolot-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete axolot-v0.12.3 --repo "${{ github.repository }}" --yes 2>$null
          git push origin :refs/tags/axolot-v0.12.3 2>$null
          gh release create axolot-v0.12.3 "axolot-v0123-build/Axolot-Client-Setup-0.12.3-RC.exe" "axolot-v0123-build/axolot-update.json" "axolot-v0123-build/Axolot-Client-v0.12.3-Source.zip" --repo "${{ github.repository }}" --title "Axolot Client v0.12.3 RC" --notes "Automatic update UI release. Axolot now discovers releases without manual scanning and surfaces a cinematic update prompt automatically at startup, on focus and during periodic background checks."
